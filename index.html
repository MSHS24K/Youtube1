<script>const API_KEY = "AIzaSyCOn03va0TM78D1cGrUIYL8B5HtpCDC49I"; // Ganti dengan YouTube API key Anda
const API_URL = "https://www.googleapis.com/youtube/v3/search";

async function searchVideos() {
  const query = document.getElementById("searchInput").value;
  const resultsContainer = document.getElementById("results");
  resultsContainer.innerHTML = "";

  if (!query.trim()) {
    alert("Please enter a search query.");
    return;
  }

  try {
    const response = await fetch(
      `${API_URL}?part=snippet&type=video&q=${encodeURIComponent(
        query
      )}&videoEmbeddable=true&maxResults=99&key=${API_KEY}`
    );
    const data = await response.json();

    if (data.items && data.items.length > 0) {
      data.items.forEach((item) => {
        const videoId = item.id.videoId;
        const title = item.snippet.title;
        const description = item.snippet.duration;
        const thumbnail = item.snippet.thumbnails.medium.url;
        const videoUrl = `https://www.youtube.com/watch?v=${videoId}`;

        const card = document.createElement("div");
        card.className = "col-12 col-sm-6 col-lg-4";
        card.innerHTML = `
          <div class="card shadow-sm h-100">
            <img src="${thumbnail}" class="card-img-top" alt="${title}">
            <div class="card-body">
              <h5 class="card-title">${truncateText(title, 8)}</h5>
                            <center><button class="btn btn-danger mb-2" onclick="playVideo('${videoId}')">
                <i class="bi bi-play-circle"></i> Play Without ads
              </button></center>
              
            </div>
          </div>
        `;
        resultsContainer.appendChild(card);
      });
    } else {
      resultsContainer.innerHTML = "<p>No results found.</p>";
    }
  } catch (error) {
    console.error("Error fetching videos:", error);
    resultsContainer.innerHTML =
      "<p>Failed to load results. Please try again later.</p>";
  }
}

function playVideo(videoId) {
  const youtubeEmbedUrl = `https://www.youtube.com/embed/${videoId}`;
  const videoPlayer = document.getElementById("videoPlayer");
  videoPlayer.src = youtubeEmbedUrl;

  const modal = new bootstrap.Modal(document.getElementById("videoModal"));
  modal.show();
}

function shareVideo(videoUrl, title) {
  if (navigator.share) {
    navigator
      .share({
        title: title,
        text: `Check out this video: ${title}`,
        url: videoUrl
      })
      .then(() => console.log("Video shared successfully!"))
      .catch((error) => console.error("Error sharing video:", error));
  } else {
    alert(
      "Sharing not supported on this browser. Please copy the URL manually."
    );
  }
}

function truncateText(text, wordLimit) {
  const words = text.split(" ");
  return words.length > wordLimit
    ? words.slice(0, wordLimit).join(" ") + "..."
    : text;
}

function handleEnter(event) {
  if (event.key === "Enter") {
    searchVideos();
  }
}
</script>
